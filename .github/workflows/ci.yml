name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Build · typecheck · links · privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:privacy
      - name: No secrets in tracked files
        run: |
          # Real project hosts / keys only — the CSP wildcard *.supabase.co is fine.
          ! git grep -nE "https://[a-z0-9]{15,}\.supabase\.co|sb_(publishable|secret)_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{30,}\.eyJ" -- ':!package-lock.json' || (echo "Possible secret committed" && exit 1)

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
